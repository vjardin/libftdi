#see http://developer.intra2net.com/git/?p=libftdi;a=blob;f=src/ftdi.c
#and http://developer.intra2net.com/git/?p=libftdi;a=blob;f=src/ftdi.h
#and http://developer.intra2net.com/git/?p=libftdi;a=tree;f=ftdi_eeprom
#and http://developer.intra2net.com/git/?p=libftdi;a=blob;f=ftdi_eeprom/example.conf
#and http://developer.intra2net.com/git/?p=libftdi;a=blob;f=ftdi_eeprom/main.c

############
# Filename #
############
filename=eeprom.new 									# Filename of the EE file to be generated. Leave empty to skip file writing
#flash_raw=false										# Boolean: Write raw eeprom file without building

## Include another config file?
#include "other.conf"

############
#   IDs    #
############
vendor_id="0x0403"      								# Integer: Vendor ID. FT245R factory default 0x0403
product_id="0x6001"     								# Integer: Product ID. FT245R factory default 0x6001
#release_number=0x0000									# Integer: Device release number (BCD). -1 = auto

##############################
# Device and Serial Strings  #
##############################
manufacturer="ACME Inc"      							# String: Manufacturer. FT245R factory default FTDI
product="USB Serial Converter" 							# String: Product. FT245R factory default FT245R USB FIFO
serial="08-15"    							   			# String: Serial number. FT245R factory default (sample chip) A9082P2B
												# Use "%UUID%" to auto-generate a UUID v4 at flash time (requires libuuid)
use_serial=true 										# Boolean: Use the serial number string

############
# Options  #
############
max_power=500   										# Integer: Max. power consumption: value * 2 mA. Use 0 if self_powered = true
self_powered=false 										# Boolean: Turn this off for bus powered
remote_wakeup=true 										# Boolean: Turn this on for remote wakeup feature

# Normally you don't have to change one of these flags
#in_is_isochronous=false								# Boolean: In Endpoint is Isochronous
#out_is_isochronous=false								# Boolean: Out Endpoint is Isochronous
#suspend_pull_downs=false								# Boolean: Enable suspend pull downs for lower power
#change_usb_version=false								# Boolean: Change USB Version
#usb_version=0x0200										# Integer: Only used when change_usb_version is enabled

#default_pid=0x6001										# Integer: Default PID for fallback device open
#is_not_pnp=false										# Boolean: Disable Plug and Play

#eeprom_type											# Integer: Chip Type / EEPROM Type. Corresponds to ftdi_chip_type in ftdi.h
#high_current=false										# Boolean: High Current Drive (FT232BM/FT245BM)

###########################
# CBUS Pin Configuration #
###########################

## FT232R / FT245R (cbus0-cbus4)
# Possible values (enum ftdi_cbus_func in ftdi.h):
# "TXDEN", "PWREN", "RXLED", "TXLED", "TXRXLED", "SLEEP",
# "CLK48", "CLK24", "CLK12", "CLK6", "IOMODE", "BB_WR", "BB_RD"
cbus0=TXLED  											# String: FT245R factory default TXLED
cbus1=RXLED  											# String: FT245R factory default RXLED
cbus2=TXDEN  											# String: FT245R factory default TXDEN
cbus3=PWREN  											# String: FT245R factory default PWREN
cbus4=SLEEP  											# String: FT245R factory default SLEEP

## FT232H (cbush0-cbush9)
# Possible values (enum ftdi_cbush_func in ftdi.h):
# "TRISTATE", "TXLED", "RXLED", "TXRXLED", "PWREN", "SLEEP",
# "DRIVE_0", "DRIVE1", "IOMODE", "TXDEN", "CLK30", "CLK15", "CLK7_5"
#cbush0=TRISTATE										# String: ACBUS0 function
#cbush1=TRISTATE										# String: ACBUS1 function
#cbush2=TRISTATE										# String: ACBUS2 function
#cbush3=TRISTATE										# String: ACBUS3 function
#cbush4=TRISTATE										# String: ACBUS4 function
#cbush5=TRISTATE										# String: ACBUS5 function
#cbush6=TRISTATE										# String: ACBUS6 function
#cbush7=TRISTATE										# String: ACBUS7 function
#cbush8=TRISTATE										# String: ACBUS8 function
#cbush9=TRISTATE										# String: ACBUS9 function

## FT230X (cbusx0-cbusx3)
# Possible values (enum ftdi_cbusx_func in ftdi.h):
# "TRISTATE", "TXLED", "RXLED", "TXRXLED", "PWREN", "SLEEP",
# "DRIVE_0", "DRIVE1", "IOMODE", "TXDEN", "CLK24", "CLK12", "CLK6",
# "BAT_DETECT", "BAT_DETECT_NEG", "I2C_TXE", "I2C_RXF", "VBUS_SENSE",
# "BB_WR", "BB_RD", "TIME_STAMP", "AWAKE"
#cbusx0=TXDEN											# String: CBUS0 function
#cbusx1=RXLED											# String: CBUS1 function
#cbusx2=TXLED											# String: CBUS2 function
#cbusx3=SLEEP											# String: CBUS3 function

##########################
# I/O Drive Settings     #
##########################
# Per-group pin drive strength, Schmitt trigger input, and output slew rate.
# Stored in EEPROM bytes 0x0C-0x0D. Number of groups depends on chip type:
#
#   FT232H:  2 groups -- group0 = ACBUS (byte 0x0C[3:0])
#                        group1 = ADBUS (byte 0x0D[3:0])
#   FT2232H: 4 groups -- group0 = ADBUS low  (byte 0x0C[3:0])
#                        group1 = ADBUS high (byte 0x0C[7:4])
#                        group2 = BDBUS low  (byte 0x0D[3:0])
#                        group3 = BDBUS high (byte 0x0D[7:4])
#   FT4232H: 4 groups -- group0 = channel A (byte 0x0C[3:0])
#                        group1 = channel B (byte 0x0C[7:4])
#                        group2 = channel C (byte 0x0D[3:0])
#                        group3 = channel D (byte 0x0D[7:4])
#   FT230X:  2 groups -- group0 = DBUS (byte 0x0C[3:0])
#                        group1 = CBUS (byte 0x0C[7:4])
#
# Nibble encoding: bits[1:0] = drive, bit[2] = slow_slew, bit[3] = schmitt
#
# Drive strength: "4MA", "8MA", "12MA", "16MA"
# Slew rate: "slow", "fast"

#group0_drive=4MA										# String: Pin drive strength
#group0_schmitt=false									# Boolean: Schmitt trigger input
#group0_slew=fast										# String: Output slew rate
#group1_drive=4MA										# String: Pin drive strength
#group1_schmitt=false									# Boolean: Schmitt trigger input
#group1_slew=fast										# String: Output slew rate
## Groups 2-3: only used on FT2232H and FT4232H (4-group chips)
#group2_drive=4MA										# String: Pin drive strength
#group2_schmitt=false									# Boolean: Schmitt trigger input
#group2_slew=fast										# String: Output slew rate
#group3_drive=4MA										# String: Pin drive strength
#group3_schmitt=false									# Boolean: Schmitt trigger input
#group3_slew=fast										# String: Output slew rate

## Example: I2C on FT232H (8mA + slow slew + Schmitt on ADBUS)
# group1_drive=8MA
# group1_schmitt=true
# group1_slew=slow

#############################
# Chip-Specific Options     #
#############################

## FT2232H
#high_current_a=false									# Boolean: High current drive on channel A
#high_current_b=false									# Boolean: High current drive on channel B
#suspend_dbus7=false									# Boolean: Use DBUS7 as USB suspend indicator

## FT2232H / FT4232H
#external_oscillator=false								# Boolean: Use external 12MHz oscillator

## FT232H (FT1284 interface mode settings)
#power_save=false										# Boolean: Power save mode
#clock_polarity=false									# Boolean: FT1284 clock idle state (true = idle high)
#data_order=false										# Boolean: FT1284 data order (true = LSB first)
#flow_control=false										# Boolean: FT1284 flow control enable

######################
# Pin Inversion      #
######################
#invert_txd=false										# Boolean: Invert TXD signal
#invert_rxd=false										# Boolean: Invert RXD signal
#invert_rts=false										# Boolean: Invert RTS signal
#invert_cts=false										# Boolean: Invert CTS signal
#invert_dtr=false										# Boolean: Invert DTR signal
#invert_dsr=false										# Boolean: Invert DSR signal
#invert_dcd=false										# Boolean: Invert DCD signal
#invert_ri=false										# Boolean: Invert RI signal

##############################
# Channel Types and Drivers  #
##############################
# Channel type -- only used on FT2232H and FT232H (multi-mode chips)
# Possible values: "UART", "FIFO", "OPTO", "CPU", "FT1284"
cha_type=FIFO											# String: Channel A type
#chb_type=UART											# String: Channel B type (FT2232H only)

# VCP driver -- selects between D2XX and VCP driver in Windows
cha_vcp=false											# Boolean: Channel A uses VCP driver
#chb_vcp=true											# Boolean: Channel B uses VCP driver
#chc_vcp=true											# Boolean: Channel C uses VCP driver (FT4232H only)
#chd_vcp=true											# Boolean: Channel D uses VCP driver (FT4232H only)

# RS485 mode -- only used on FT4232H
#cha_rs485=false										# Boolean: Channel A RS485 mode
#chb_rs485=false										# Boolean: Channel B RS485 mode
#chc_rs485=false										# Boolean: Channel C RS485 mode
#chd_rs485=false										# Boolean: Channel D RS485 mode

#######################
# User Data Area      #
#######################
# Embed arbitrary binary data into the EEPROM at a given address.
# Ensure user_data_addr does not overlap with string descriptors.
#user_data_addr=0x18									# Integer: Start address for user data
#user_data_file="userdata.bin"							# String: Filename of the binary data to embed
